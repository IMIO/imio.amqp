[project]
name = "imio.amqp"
version = "0.3.1.dev0"
description = "AMQP helpers for iMio data exchange"
readme = "README.rst"
license = "GPL-2.0-or-later"
authors = [{ name = "IMIO", email = "support@imio.be" }]
requires-python = ">=3.10"
dependencies = ["pika"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--capture=no"
testpaths = ["src/imio"]

[dependency-groups]
dev = [
    "mock>=5.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
